name: VVCourier
options:
  bundleIdPrefix: ru.local
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  VVCourier:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ['*.swift']
        excludes: ['.git', '.github', 'VVCourier', 'build', 'DerivedData', '*.xcodeproj', 'UITests', 'Resources', 'Tests']
      - path: Resources
    info:
      path: VVCourier/Info.plist
      properties:
        CFBundleDisplayName: VV Courier
        CFBundleName: VV Courier
        CFBundleShortVersionString: '1.2.1'
        CFBundleVersion: '13'
        NSCameraUsageDescription: Фото чеков и хладоэлементов, сканирование QR-кодов терминала, очереди и пакетов заказа.
        NSPhotoLibraryUsageDescription: Выбор фотографии чека или хладоэлементов для отправки в ВкусВилл.
        NSPhotoLibraryAddUsageDescription: Сохранение карточки с итогами заработка в Фото по твоему запросу.
        NSLocationWhenInUseUsageDescription: ВВ проверяет фактическое нахождение у магазина или адреса заказа перед входом в очередь, прибытием, доставкой и возвратом.
        NSBluetoothAlwaysUsageDescription: Подключение к моноколесу для телеметрии и доступных функций управления.
        UIBackgroundModes: [bluetooth-central, audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [ru.local.vvcourier.express-refresh]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.local.vvcourier.ios
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CourierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VVCourier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.local.vvcourier.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VVCourier
schemes:
  VVCourier:
    build:
      targets:
        VVCourier: all
    test:
      targets: [CourierUITests]
